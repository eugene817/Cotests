{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{.Title}} — Cotests</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/htmx.min.js"></script>
  <script src="/static/js/app.js"></script>
</head>
<body>
  <nav class="glass glass-nav" style="display:flex; align-items:center; justify-content:space-between; gap:var(--spacing-3);">
    <a href="/" class="label" style="font-family:var(--font-display); font-size:1.25rem; color:var(--primary); text-decoration:none;">Cotests</a>
    <span style="display:flex; align-items:center; gap:var(--spacing-2);">
      <a href="/contests" class="btn btn-tertiary">Contests</a>
      {{if .User}}
        <span class="label-sm" style="margin-left:var(--spacing-2);">{{.User.Email}}</span>
        {{if eq .User.Role "admin"}}<a href="/admin/contests" class="btn btn-tertiary">Admin</a>{{end}}
        <form method="post" action="/logout" hx-post="/logout" style="display:inline">
          <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
          <button class="btn btn-tertiary" type="submit">Logout</button>
        </form>
      {{else}}
        <a href="/login" class="btn btn-tertiary">Login</a>
        <a href="/register" class="btn btn-tertiary">Register</a>
      {{end}}
    </span>
  </nav>
  {{.Content}}
</body>
</html>
{{end}}
